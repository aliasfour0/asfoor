<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة المعدل الجامعي</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-width:0;overflow-x:hidden}
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}
.container{width:100%;max-width:1200px;margin:0 auto;padding:18px 14px 45px}
header{width:100%;background:#172033;color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:27px} header p{margin:0;opacity:.85}
.reference-card{width:100%;background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:10px;margin:14px 0;overflow:hidden}
.reference-card img{display:block;width:100%;max-width:100%;height:auto;margin:0 auto;border-radius:10px}
#terms{width:100%;display:flex;flex-direction:column;gap:14px}
.term{width:100%;background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(20,30,50,.05)}
.term-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.term h2{margin:0;font-size:19px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:8px;border-bottom:1px solid #edf0f5;text-align:center}
th{font-size:13px;color:#596579;background:#fafbfc}
td:first-child{width:45%}td:nth-child(2){width:45%}td:last-child{width:10%}
input{width:100%;padding:10px;border:1px solid #d7dce5;border-radius:9px;font-size:15px;text-align:center;background:#fff}
button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}
.add{background:#eaf2ff;color:#1769d1;margin-top:10px}
.del{background:#fff0f0;color:#c62828}
.primary{background:#1769d1;color:#fff}
.result{margin-top:12px;padding:12px;border-radius:11px;background:#f2f7ff;text-align:center}
.result strong{font-size:23px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.summary{background:#172033;color:#fff;border-radius:16px;padding:19px;margin-top:14px;text-align:center}
.summary .big{font-size:35px;font-weight:800;margin-top:5px}
@media(max-width:650px){
.container{padding:10px 7px 30px}
header{padding:16px}
h1{font-size:22px}
.term{padding:10px}
th,td{padding:6px 4px}
input{padding:8px;font-size:14px}
.reference-card{padding:6px}
}
</style>
</head>
<body>
<div class="container">
<header>

</header>

  box.className="term";
  const deleteButton = ti >= 3
    ? `<button class="del" onclick="removeTerm(${ti})">حذف الترم</button>`
    : "";
  box.innerHTML=`<div class="term-head">
   <h2>${t.name}</h2>
   <label style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;">
    <input type="checkbox" ${t.direct ? "checked" : ""} onchange="toggleDirect(${ti},this.checked)">
    اعرف معدل هذا الترم
   </label>
   ${deleteButton}
  </div>
  <div id="courses-${ti}" style="${t.direct ? "display:none;" : ""}">
   <table><thead><tr><th>الدرجة</th><th>عدد الوحدات</th><th></th></tr></thead><tbody>
   ${t.rows.map((r,ri)=>`<tr>
    <td><input type="number" step="0.01" value="${r[0]}" oninput="setVal(${ti},${ri},0,this.value)"></td>
    <td><input type="number" step="1" min="0" value="${r[1]}" oninput="setVal(${ti},${ri},1,this.value)"></td>
    <td><button class="del" onclick="removeRow(${ti},${ri})">×</button></td>
   </tr>`).join("")}
   </tbody></table>
   <button class="add" onclick="addRow(${ti})">+ إضافة مادة</button>
  </div>
  <div id="direct-${ti}" style="${t.direct ? "" : "display:none;"};margin-top:10px;">
   <table><thead><tr><th>معدل الترم</th><th>عدد الوحدات</th></tr></thead><tbody><tr>
    <td><input type="number" step="0.01" value="${t.directGpa ?? ""}" placeholder="معدل الترم" oninput="setDirect(${ti},'gpa',this.value)"></td>
    <td><input type="number" step="1" min="0" value="${t.directUnits ?? ""}" placeholder="عدد الوحدات" oninput="setDirect(${ti},'units',this.value)"></td>
   </tr></tbody></table>
  </div>
  <div class="result">معدل الترم: <strong id="term-${ti}">0.00</strong></div>`;
  root.appendChild(box);
 });
 calculate();
}
function setVal(t,r,c,v){terms[t].rows[r][c]=v;calculate();}
function addRow(t){terms[t].rows.push(["",""]);render();}
function toggleDirect(t,enabled){
 terms[t].direct=enabled;
 if(!enabled){delete terms[t].directGpa;delete terms[t].directUnits;}
 render();
}
function setDirect(t,type,v){
 if(type==="gpa") terms[t].directGpa=v;
 else terms[t].directUnits=v;
 calculate();
}
function removeRow(t,r){terms[t].rows.splice(r,1);render();}
function addTerm(){
 const next=terms.length+1;
 terms.push({
  name:"الترم "+next,
  rows:[["",""]],
  direct:false,
  directGpa:"",
  directUnits:""
 });
 render();
}
function removeTerm(t){
 if(t>=3){
  terms.splice(t,1);
  render();
 }
}
function calculate(){
 let totalPoints=0,totalUnits=0;

 terms.forEach((t,ti)=>{
  let p=0,u=0;

  if(t.direct){
   const g=parseFloat(t.directGpa);
   const x=parseFloat(t.directUnits);
   if(Number.isFinite(g) && Number.isFinite(x) && x>0){
    p=g*x;
    u=x;
   }
  }else{
   t.rows.forEach(r=>{
    const g=parseFloat(r[0]);
    const x=parseFloat(r[1]);
    if(Number.isFinite(g) && Number.isFinite(x) && x>0){
     p += g*x;
     u += x;
    }
   });
  }

  totalPoints += p;
  totalUnits += u;

  const el=document.getElementById("term-"+ti);
  if(el) el.textContent=fmt(u ? p/u : 0);
 });

 const cumulative=document.getElementById("cumulative");
 if(cumulative) cumulative.textContent=fmt(totalUnits ? totalPoints/totalUnits : 0);
}

function resetAll(){
 terms=[
  {name:"الترم الأول",rows:[["",""]]},
  {name:"الترم الثاني",rows:[["",""]]},
  {name:"الترم الثالث",rows:[["",""]]}
 ];
 render();
}
render();
</script>

</body>
